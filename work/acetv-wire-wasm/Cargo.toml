[package]
name = "acetv-wire-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ace-wire = { path = "../outpace-research/crates/ace-wire" }
wasm-bindgen = "=0.2.105"
getrandom = { version = "0.2", features = ["js"] }
serde_json = "1"
sha2 = "0.11"
base64ct = { version = "1.8", features = ["alloc"] }
sha1 = "0.11"
roxmltree = "0.21"
